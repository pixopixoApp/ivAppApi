services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      # Data only under ./volumes/ — no Docker named volumes
      - ./volumes/mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    volumes:
      - ./volumes/redis:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      UPLOAD_LIMIT: 256M
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8101}:80"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    # 本地：DB 迁移已到 head（20260819_0011），跳过 alembic 规避 revision 冲突；
    # 生产请恢复 `alembic upgrade head && ...`（见 Dockerfile）
    command:
      - python
      - -m
      - uvicorn
      - app.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8100"
      - --workers
      - "${API_WORKERS:-3}"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      MEDIA_CACHE_ENABLED: ${MEDIA_CACHE_ENABLED:-true}
      MEDIA_CACHE_ROOT: /data/media-cache
      CREATOR_LOCAL_UPLOAD_ENABLED: ${CREATOR_LOCAL_UPLOAD_ENABLED:-true}
      CREATOR_LEGACY_OSS_UPLOAD_ENABLED: ${CREATOR_LEGACY_OSS_UPLOAD_ENABLED:-true}
    ports:
      - "0.0.0.0:${API_PORT:-8100}:8100"  # TEST: temp public bind, revert to 127.0.0.1
    volumes:
      # Code (read-only)
      - ./app:/app/app:ro
      - ./scripts:/app/scripts:ro
      - ${HTML_IMPORT_SPOOL_HOST_PATH:-./volumes/html-imports}:/data/html-imports
      - ${MEDIA_CACHE_HOST_PATH:-/opt/play_video/shared/media-cache}:/data/media-cache
    networks:
      default:
      pixo-backend:
        aliases:
          - ivapp-api
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/health"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 15s

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.worker"]
    depends_on:
      api:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
    volumes:
      - ./app:/app/app:ro
    networks:
      default:
      pixo-backend:

  cdn-worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["python", "-m", "app.cdn_worker"]
    depends_on:
      api:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql+pymysql://root:${MYSQL_ROOT_PASSWORD}@mysql:3306/${MYSQL_DATABASE}
      # Settings requires this field, but the CDN worker never authenticates
      # publish requests. Keep the real publish secret out of this container.
      PUBLISH_KEY: cdn-worker-unused
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ALIYUN_OSS_PUBLIC_BASE_URL: ${ALIYUN_OSS_PUBLIC_BASE_URL:-}
      PUBLIC_MEDIA_LEGACY_ORIGINS: ${PUBLIC_MEDIA_LEGACY_ORIGINS:-}
      # Public URLs are non-secret inputs required by the same fail-closed
      # production contract used by the API and creator worker.
      PUBLIC_SHARE_BASE_URL: ${PUBLIC_SHARE_BASE_URL:-}
      PUBLIC_GAME_BASE_URL: ${PUBLIC_GAME_BASE_URL:-}
      SEO_PUBLIC_BASE_URL: ${SEO_PUBLIC_BASE_URL:-}
      OSS_ROOT_PREFIX: ${OSS_ROOT_PREFIX:-ivapp-media/v1}
      CDN_CACHE_ENABLED: ${CDN_CACHE_ENABLED:-false}
      CDN_PREFETCH_ON_PUBLISH: ${CDN_PREFETCH_ON_PUBLISH:-true}
      CDN_DOMAIN: ${CDN_DOMAIN:-}
      CDN_API_REGION: ${CDN_API_REGION:-cn-hangzhou}
      CDN_WORKER_POLL_SECONDS: ${CDN_WORKER_POLL_SECONDS:-2}
      CDN_PROVIDER_POLL_SECONDS: ${CDN_PROVIDER_POLL_SECONDS:-10}
      CDN_WORKER_BATCH_SIZE: ${CDN_WORKER_BATCH_SIZE:-50}
      CDN_WORKER_MAX_ATTEMPTS: ${CDN_WORKER_MAX_ATTEMPTS:-6}
      CDN_WORKER_LEASE_SECONDS: ${CDN_WORKER_LEASE_SECONDS:-300}
      ALIBABA_CLOUD_ECS_METADATA: ${ALIBABA_CLOUD_ECS_METADATA:-}
      ALIYUN_CDN_ACCESS_KEY_ID: ${ALIYUN_CDN_ACCESS_KEY_ID:-}
      ALIYUN_CDN_ACCESS_KEY_SECRET: ${ALIYUN_CDN_ACCESS_KEY_SECRET:-}
    volumes:
      - ./app:/app/app:ro
    networks:
      default:
      pixo-backend:

networks:
  pixo-backend:
    external: true
